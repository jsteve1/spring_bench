x-matrix-service: &matrix-service
  networks: [matrix-net]
  environment: &matrix-env
    SERVER_PORT: "8080"
    DB_PATH: /tmp/insurance.db
    SPRING_PROFILES_ACTIVE: benchmark
  volumes:
    - ./apps/insurance-j8.jar:/app.jar:ro
  command: sh -c "java $$JAVA_OPTS -jar /app.jar"
  restart: unless-stopped

services:
  java8-platform-low:
    <<: *matrix-service
    image: eclipse-temurin:8-jdk-alpine@sha256:0a67288aa987bc8bf6eafcd7f3eb0b7684e458b4587dd459523830854acd4ff5
    container_name: java8-platform-low
    environment:
      <<: *matrix-env
      JAVA_OPTS: "-Xmx192m -XX:StartFlightRecording=name=bench,settings=profile,disk=true,maxsize=256m,dumponexit=true,filename=/tmp/bench.jfr -XX:FlightRecorderOptions=stackdepth=128"
      BENCH_RUNTIME: "8"
      BENCH_THREADING: "platform"
      BENCH_FOOTPRINT: "low"
      BENCH_TARGET: "java8-platform-low"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    volumes:
      - ./apps/insurance-j8.jar:/app.jar:ro
    ports:
      - "8081:8080"

  java8-platform-mid:
    <<: *matrix-service
    image: eclipse-temurin:8-jdk-alpine@sha256:0a67288aa987bc8bf6eafcd7f3eb0b7684e458b4587dd459523830854acd4ff5
    container_name: java8-platform-mid
    environment:
      <<: *matrix-env
      JAVA_OPTS: "-Xmx768m -XX:StartFlightRecording=name=bench,settings=profile,disk=true,maxsize=256m,dumponexit=true,filename=/tmp/bench.jfr -XX:FlightRecorderOptions=stackdepth=128"
      BENCH_RUNTIME: "8"
      BENCH_THREADING: "platform"
      BENCH_FOOTPRINT: "mid"
      BENCH_TARGET: "java8-platform-mid"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    volumes:
      - ./apps/insurance-j8.jar:/app.jar:ro
    ports:
      - "8082:8080"

  java11-platform-low:
    <<: *matrix-service
    image: eclipse-temurin:11-jdk-alpine@sha256:7ab5b720f367e4bb4da17cd9cd71e761572d14138d4b846d110af49f3ea116a0
    container_name: java11-platform-low
    environment:
      <<: *matrix-env
      JAVA_OPTS: "-Xmx384m -XX:StartFlightRecording=name=bench,settings=profile,disk=true,maxsize=256m,dumponexit=true,filename=/tmp/bench.jfr -XX:FlightRecorderOptions=stackdepth=128"
      BENCH_RUNTIME: "11"
      BENCH_THREADING: "platform"
      BENCH_FOOTPRINT: "low"
      BENCH_TARGET: "java11-platform-low"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    volumes:
      - ./apps/insurance-j11.jar:/app.jar:ro
    ports:
      - "8083:8080"

  java11-platform-high:
    <<: *matrix-service
    image: eclipse-temurin:11-jdk-alpine@sha256:7ab5b720f367e4bb4da17cd9cd71e761572d14138d4b846d110af49f3ea116a0
    container_name: java11-platform-high
    environment:
      <<: *matrix-env
      JAVA_OPTS: "-Xmx3g -XX:StartFlightRecording=name=bench,settings=profile,disk=true,maxsize=256m,dumponexit=true,filename=/tmp/bench.jfr -XX:FlightRecorderOptions=stackdepth=128"
      BENCH_RUNTIME: "11"
      BENCH_THREADING: "platform"
      BENCH_FOOTPRINT: "high"
      BENCH_TARGET: "java11-platform-high"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
    volumes:
      - ./apps/insurance-j11.jar:/app.jar:ro
    ports:
      - "8084:8080"

  java17-platform-mid:
    <<: *matrix-service
    image: eclipse-temurin:17-jdk-alpine@sha256:638937c54b6d63f0973a20501973e7c433a36b1f22262bd2b25afa7be5ff8c4a
    container_name: java17-platform-mid
    environment:
      <<: *matrix-env
      JAVA_OPTS: "-Xmx1500m -XX:StartFlightRecording=name=bench,settings=profile,disk=true,maxsize=256m,dumponexit=true,filename=/tmp/bench.jfr -XX:FlightRecorderOptions=stackdepth=128"
      BENCH_RUNTIME: "17"
      BENCH_THREADING: "platform"
      BENCH_FOOTPRINT: "mid"
      BENCH_TARGET: "java17-platform-mid"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    volumes:
      - ./apps/insurance-j17.jar:/app.jar:ro
    ports:
      - "8085:8080"

  java17-platform-high:
    <<: *matrix-service
    image: eclipse-temurin:17-jdk-alpine@sha256:638937c54b6d63f0973a20501973e7c433a36b1f22262bd2b25afa7be5ff8c4a
    container_name: java17-platform-high
    environment:
      <<: *matrix-env
      JAVA_OPTS: "-Xmx6g -XX:StartFlightRecording=name=bench,settings=profile,disk=true,maxsize=256m,dumponexit=true,filename=/tmp/bench.jfr -XX:FlightRecorderOptions=stackdepth=128"
      BENCH_RUNTIME: "17"
      BENCH_THREADING: "platform"
      BENCH_FOOTPRINT: "high"
      BENCH_TARGET: "java17-platform-high"
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 8g
    volumes:
      - ./apps/insurance-j17.jar:/app.jar:ro
    ports:
      - "8086:8080"

  java21-virtual-low:
    <<: *matrix-service
    image: eclipse-temurin:21-jdk-alpine@sha256:1ff763083f2993d57d0bf374ab10bb3e2cb873af6c13a04458ebbd3e0337dc76
    container_name: java21-virtual-low
    environment:
      <<: *matrix-env
      JAVA_OPTS: "-Xmx192m -XX:StartFlightRecording=name=bench,settings=profile,disk=true,maxsize=256m,dumponexit=true,filename=/tmp/bench.jfr -XX:FlightRecorderOptions=stackdepth=128"
      BENCH_RUNTIME: "21"
      BENCH_THREADING: "virtual"
      BENCH_FOOTPRINT: "low"
      BENCH_TARGET: "java21-virtual-low"
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    volumes:
      - ./apps/insurance-j21.jar:/app.jar:ro
    ports:
      - "8087:8080"

  java21-virtual-high:
    <<: *matrix-service
    image: eclipse-temurin:21-jdk-alpine@sha256:1ff763083f2993d57d0bf374ab10bb3e2cb873af6c13a04458ebbd3e0337dc76
    container_name: java21-virtual-high
    environment:
      <<: *matrix-env
      JAVA_OPTS: "-Xmx3g -XX:StartFlightRecording=name=bench,settings=profile,disk=true,maxsize=256m,dumponexit=true,filename=/tmp/bench.jfr -XX:FlightRecorderOptions=stackdepth=128"
      BENCH_RUNTIME: "21"
      BENCH_THREADING: "virtual"
      BENCH_FOOTPRINT: "high"
      BENCH_TARGET: "java21-virtual-high"
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
    volumes:
      - ./apps/insurance-j21.jar:/app.jar:ro
    ports:
      - "8088:8080"

  java25-virtual-arm-low:
    <<: *matrix-service
    # Pin the arm64 platform manifest. The multi-arch index digest resolves to
    # amd64 locally and Docker errors with "cannot overwrite digest" for arm64.
    image: eclipse-temurin:25-jdk-alpine@sha256:a73f79083d039f5413c6eb0918ec5a714390b8f7b40d64a2ff4f5a902246cf44
    platform: linux/arm64/v8
    container_name: java25-virtual-arm-low
    environment:
      <<: *matrix-env
      JAVA_OPTS: "-Xmx384m -XX:StartFlightRecording=name=bench,settings=profile,disk=true,maxsize=256m,dumponexit=true,filename=/tmp/bench.jfr -XX:FlightRecorderOptions=stackdepth=128"
      BENCH_RUNTIME: "25"
      BENCH_THREADING: "virtual"
      BENCH_FOOTPRINT: "low"
      BENCH_TARGET: "java25-virtual-arm-low"
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    volumes:
      - ./apps/insurance-modern.jar:/app.jar:ro
    ports:
      - "8089:8080"

  java25-virtual-arm-high:
    <<: *matrix-service
    # Same arm64 platform digest as java25-virtual-arm-low (see note there).
    image: eclipse-temurin:25-jdk-alpine@sha256:a73f79083d039f5413c6eb0918ec5a714390b8f7b40d64a2ff4f5a902246cf44
    platform: linux/arm64/v8
    container_name: java25-virtual-arm-high
    environment:
      <<: *matrix-env
      JAVA_OPTS: "-Xmx3g -XX:StartFlightRecording=name=bench,settings=profile,disk=true,maxsize=256m,dumponexit=true,filename=/tmp/bench.jfr -XX:FlightRecorderOptions=stackdepth=128"
      BENCH_RUNTIME: "25"
      BENCH_THREADING: "virtual"
      BENCH_FOOTPRINT: "high"
      BENCH_TARGET: "java25-virtual-arm-high"
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
    volumes:
      - ./apps/insurance-modern.jar:/app.jar:ro
    ports:
      - "8090:8080"

  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
    container_name: orchestrator
    networks: [matrix-net]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./loadtests:/loadtests:ro
      - ./orchestrator/runs:/app/runs
    environment:
      - PORT=3000
      - COMPOSE_PROJECT_NAME=spring_bench
      - DASHBOARD_DIST=/app/dashboard
      - RUNS_DIR=/app/runs
      - LOADTESTS_PATH=/loadtests
      - DOCKER_NETWORK=matrix-net
      - ORCHESTRATOR_CONTAINER=orchestrator
      - K6_REST_IMAGE=grafana/k6:1.8.0
      - K6_SSE_IMAGE=bench/k6-sse
      - STATS_INTERVAL_MS=2000
      # Set both in .env to require HTTP Basic auth. Mandatory before exposing
      # the orchestrator through a tunnel: it can stop containers via the socket.
      - ORCH_BASIC_USER=${ORCH_BASIC_USER:-}
      - ORCH_BASIC_PASS=${ORCH_BASIC_PASS:-}
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Build-only: docker compose --profile tools build k6-sse
  k6-sse:
    profiles: [tools]
    image: bench/k6-sse
    build:
      context: .
      dockerfile: loadtests/Dockerfile.k6-sse

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2026.6.1@sha256:6d91c121b803126f7a5344005d17a9324788fc09d305b6e2560ec6040a7ae283
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks: [matrix-net]
    depends_on:
      - orchestrator

networks:
  matrix-net:
    name: matrix-net
