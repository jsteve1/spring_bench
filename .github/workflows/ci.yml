name: ci

on:
  push:
    branches: [main, "feat/**", "cursor/**"]
  pull_request:

jobs:
  unit:
    name: JS unit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            orchestrator/package-lock.json
      - name: Orchestrator unit
        run: |
          cd orchestrator
          npm install --ignore-scripts
          npm run test:unit
      - name: Dashboard unit + build
        run: |
          cd dashboard
          npm install
          npm run test:unit
          npm run build

  service:
    name: Service build + standalone smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build shells
        run: |
          cd service
          mvn -B -pl app-modern,app-legacy -am package -DskipTests
          mkdir -p ../apps
          cp app-modern/target/insurance-modern.jar ../apps/insurance-modern.jar
          cp app-legacy/target/insurance-legacy.jar ../apps/insurance-legacy.jar
      - name: Standalone smoke (DoD #8)
        run: ./scripts/smoke-standalone.sh

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config -q

  openapi:
    name: OpenAPI contract parity
    runs-on: ubuntu-latest
    needs: [service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build jars
        run: |
          cd service
          mvn -B -pl app-modern,app-legacy -am package -DskipTests
          mkdir -p ../apps
          cp app-modern/target/insurance-modern.jar ../apps/insurance-modern.jar
          cp app-legacy/target/insurance-legacy.jar ../apps/insurance-legacy.jar
      - name: Start shells
        run: |
          mkdir -p /tmp/ci-data
          SPRING_PROFILES_ACTIVE=benchmark SERVER_PORT=8080 DB_PATH=/tmp/ci-data/modern.db \
            java -jar apps/insurance-modern.jar > /tmp/modern.log 2>&1 &
          echo $! > /tmp/modern.pid
          SPRING_PROFILES_ACTIVE=benchmark SERVER_PORT=8081 DB_PATH=/tmp/ci-data/legacy.db \
            java -jar apps/insurance-legacy.jar > /tmp/legacy.log 2>&1 &
          echo $! > /tmp/legacy.pid
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8080/health >/dev/null && \
              curl -sf http://127.0.0.1:8081/health >/dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8080/health
          curl -sf http://127.0.0.1:8081/health
      - name: Diff OpenAPI contracts
        run: |
          LEGACY_URL=http://127.0.0.1:8081 MODERN_URL=http://127.0.0.1:8080 \
            node scripts/openapi-diff.mjs
      - name: Stop shells
        if: always()
        run: |
          kill $(cat /tmp/modern.pid) 2>/dev/null || true
          kill $(cat /tmp/legacy.pid) 2>/dev/null || true
