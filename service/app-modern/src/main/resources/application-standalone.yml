spring:
  config:
    activate:
      on-profile: standalone
  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/office.db}

bench:
  seed:
    enabled: false

app:
  security:
    enabled: ${APP_SECURITY_ENABLED:true}
    admin-user: ${APP_ADMIN_USER:admin}
    admin-password: ${APP_ADMIN_PASSWORD:changeme}
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
